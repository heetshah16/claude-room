<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Strict CSP: no inline scripts (only this exact nonce), no innerHTML-style
  execution vectors, styles and fonts only from the webview's own origin.
  Every server- or model-supplied string webview.js renders goes through
  textContent, never innerHTML — same rule src/ui.mjs states for the room's
  own browser client, same reason: message text, tool inputs, tool results
  and worker output are all untrusted.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} https: data:; style-src {{cspSource}}; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{styleUri}}">
<title>Claude Room</title>
</head>
<body>
  <div id="fatal" class="fatal" hidden></div>
  <div id="rate-limit" class="rate-limit-banner" hidden></div>
  <div id="messages" class="messages">
    <div id="empty-state" class="empty-state">
      <div class="empty-state-title">Orchestrator</div>
      <div class="empty-state-hint">Delegates mechanical work to workers, and reports back here.</div>
    </div>
  </div>
  <div id="status" class="status" hidden></div>
  <div id="context-panel" class="panel" hidden role="region" aria-label="Context usage">
    <div class="panel-head">
      <span class="panel-title">Context</span>
      <span id="context-total" class="panel-total"></span>
    </div>
    <!-- The bar is decorative: the legend below carries the same numbers as
         text, because length and hue alone convey nothing to a screen reader
         or to anyone who cannot separate two of the six colours. -->
    <div id="context-bar" class="bar" aria-hidden="true"></div>
    <div id="context-legend" class="legend"></div>
    <div id="context-verdict" class="verdict" hidden></div>
    <div id="context-tables"></div>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message the orchestrator... (Enter to send, Shift+Enter for a new line)"></textarea>
    <div class="composer-toolbar">
      <div class="composer-toolbar-left">
        <button id="model-picker" class="chip" type="button" aria-expanded="false"
                aria-controls="model-select" title="Change model">model: (unknown)</button>
        <select id="model-select" class="chip-select" hidden aria-label="Model"></select>
        <button id="context-chip" class="chip" type="button" aria-expanded="false"
                aria-controls="context-panel" title="Context usage">context: &mdash;</button>
      </div>
      <button id="send" class="send-btn" type="button" aria-label="Send" title="Send">&uarr;</button>
    </div>
  </div>
  <script nonce="{{nonce}}" src="{{markdownUri}}"></script>
  <script nonce="{{nonce}}" src="{{modelUri}}"></script>
  <script nonce="{{nonce}}" src="{{iconsUri}}"></script>
  <script nonce="{{nonce}}" src="{{contextUri}}"></script>
  <script nonce="{{nonce}}" src="{{probesUri}}"></script>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
