<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Same strict CSP as the chat panel. Everything rendered here comes from
  outside the extension: the brief is written by the orchestrator (a model),
  the tool names and inputs by a free model, and the reply by that same worker.
  All of it goes through textContent.
-->

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="../src/chat/webview.css">
<link rel="stylesheet" href="./viewport.css">
<title>Worker</title>
</head>
<body>
  <div class="worker-header">
    <div class="worker-header-main">
      <span id="w-dot" class="worker-dot" aria-hidden="true"></span>
      <span id="w-title" class="worker-title"></span>
      <span id="w-status" class="worker-status"></span>
      <button id="w-interrupt" class="chip destructive" type="button" hidden
              title="Abort the running turn">Interrupt</button>
    </div>
    <div id="w-sub" class="worker-header-sub"></div>
  </div>

  <div id="w-brief" class="panel" hidden>
    <div class="panel-head">
      <span class="panel-title">Brief from orchestrator</span>
      <span id="w-class" class="panel-total"></span>
    </div>
    <div id="w-task" class="brief-task"></div>
    <div id="w-fields" class="brief-fields"></div>
  </div>

  <details id="w-tools" class="detail" hidden>
    <summary id="w-tools-summary"></summary>
    <div id="w-tools-list" class="detail-row"></div>
  </details>

  <div id="messages" class="messages">
    <div id="empty-state" class="empty-state">
      <div class="empty-state-title">Nothing yet</div>
      <div class="empty-state-hint">This worker has not been given anything to do.</div>
    </div>
  </div>

  <div class="composer">
    <div id="w-queued" class="queued" hidden></div>
    <textarea id="input" rows="1" placeholder="Message this worker…"></textarea>
    <div class="composer-toolbar">
      <div class="composer-toolbar-left">
        <span id="w-hint" class="queued-hint"></span>
      </div>
      <button id="send" class="send-btn" type="button" aria-label="Send" title="Send">&uarr;</button>
    </div>
  </div>

  <script>window.acquireVsCodeApi = () => ({ postMessage() {}, getState: () => null, setState() {} })</script>
  <script src="../src/chat/icons.js"></script>
  <script src="../src/chat/workers-format.js"></script>
  <script src="../src/chat/worker-webview.js"></script>
  <script src="./replay.js"></script>
</body>
</html>
