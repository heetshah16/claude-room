<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>webview harness</title>
<!--
  Loads the REAL webview stylesheet and the REAL chat scripts from ../src/chat/,
  so what is screenshotted here is what ships. Nothing is reimplemented; a CSS
  or renderer bug shows up as itself.

  Only two things are faked, because they are the only two seams a webview has
  with VS Code:

    1. `acquireVsCodeApi`, stubbed below.
    2. The theme custom properties, generated into theme.css by shoot.js from
       the theme files of the editor actually installed on this machine.

  theme.css and replay.js are written by shoot.js on every run and are
  gitignored. Opening this file directly without running shoot.js first shows an
  unstyled, empty page -- that is expected, not a bug.
-->
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="../src/chat/webview.css">
<!-- Written per shot by shoot.js: pins the layout width in CSS pixels,
     because Chrome refuses to open a window narrower than ~500px and
     Windows display scaling desynchronises --window-size from CSS px. -->
<link rel="stylesheet" href="./viewport.css">
</head>
<body>
  <div id="fatal" class="fatal" hidden></div>
  <div id="rate-limit" class="rate-limit-banner" hidden></div>
  <div id="messages" class="messages">
    <div id="empty-state" class="empty-state">
      <div class="empty-state-title">Orchestrator</div>
      <div class="empty-state-hint">Delegates mechanical work to workers, and reports back here.</div>
    </div>
  </div>
  <div id="status" class="status" hidden></div>
  <div id="context-panel" class="panel" hidden role="region" aria-label="Context usage">
    <div class="panel-head">
      <span class="panel-title">Context</span>
      <span id="context-total" class="panel-total"></span>
    </div>
    <div id="context-bar" class="bar" aria-hidden="true"></div>
    <div id="context-legend" class="legend"></div>
    <div id="context-verdict" class="verdict" hidden></div>
    <div id="context-tables"></div>
  </div>
  <div id="dashboard" class="dash" hidden>
    <div id="dash-list" class="dash-list" role="listbox" aria-label="Commands and skills"></div>
    <div id="dash-empty" class="dash-empty" hidden>No command or skill matches</div>
  </div>
  <div id="permission-panel" class="panel" hidden role="region" aria-label="Permission mode">
    <div class="panel-head"><span class="panel-title">Permission mode</span></div>
    <div id="permission-list" class="dash-list" role="listbox" aria-label="Permission mode"></div>
  </div>
  <div class="composer">
    <div id="attachments" class="attachments" hidden></div>
    <textarea id="input" aria-autocomplete="list" aria-controls="dash-list" rows="1" placeholder="Message the orchestrator…"></textarea>
    <div class="composer-toolbar">
      <div class="composer-toolbar-left">
        <button id="attach-btn" class="icon-btn" type="button" aria-label="Attach a file" title="Attach a file"></button>
        <button id="dash-btn" class="icon-btn" type="button" aria-label="Commands and skills" title="Commands and skills"></button>
        <button id="permission-chip" class="chip" type="button" aria-expanded="false"
                aria-controls="permission-panel" title="Permission mode">mode</button>
        <button id="model-picker" class="chip" type="button" aria-expanded="false"
                aria-controls="model-select" title="Change model">(no model)</button>
        <select id="model-select" class="chip-select" hidden aria-label="Model"></select>
        <button id="context-chip" class="chip" type="button" aria-expanded="false"
                aria-controls="context-panel" title="Context usage">context: &mdash;</button>
      </div>
      <button id="send" class="send-btn" type="button" aria-label="Send" title="Send">&uarr;</button>
    </div>
  </div>
  <script>
    // The one seam the webview has with the extension host.
    window.acquireVsCodeApi = () => ({ postMessage() {}, getState: () => null, setState() {} })
  </script>
  <script src="../src/chat/markdown.js"></script>
  <script src="../src/chat/model.js"></script>
  <script src="../src/chat/icons.js"></script>
  <script src="../src/chat/context.js"></script>
  <script src="../src/chat/probes.js"></script>
  <script src="../src/chat/commands.js"></script>
  <script src="../src/chat/permissions.js"></script>
  <script src="../src/chat/webview.js"></script>
  <script src="./replay.js"></script>
</body>
</html>
